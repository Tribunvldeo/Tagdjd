<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>PLAY STREAM Premium</title>
<meta name="description" content="PLAY STREAM - Koleksi video pilihan dengan tampilan premium.">

<style>
:root{
  --bg:#0f172a;
  --panel:#1e293b;
  --primary:#0284c7;
  --primary-hover:#0369a1;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#334155;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
header{
  background:linear-gradient(135deg,#0f172a,#1e293b);
  border-bottom:1px solid var(--border);
  padding:18px 14px;
  color:#ffffff;
}
.header-inner{
  max-width:1150px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:43px;height:43px;
  border-radius:12px;
  background:#1e293b;
  color:#38bdf8;
  display:grid;
  place-items:center;
  font-size:22px;
  font-weight:900;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  border: 1px solid var(--border);
}
.brand h1{margin:0;font-size:21px;letter-spacing:1px;color:#ffffff}
.brand small{color:#bae6fd;font-size:10px;letter-spacing:2px}
.header-label{
  color:#ffffff;
  border:1px solid rgba(255,255,255,0.2);
  padding:7px 11px;
  border-radius:20px;
  font-size:11px;
  background:rgba(255,255,255,0.05);
}
.container{
  max-width:1150px;
  margin:auto;
  padding:18px 14px 35px;
}

/* PLAYER DI ATAS */
.player-section{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
  margin-bottom:20px;
  scroll-margin-top:10px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
}
.player-heading{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}
.player-heading h2{
  margin:0;
  font-size:16px;
  color:#38bdf8;
}
.player-heading span{font-size:10px;color:var(--muted)}
.player-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}
.player-frame iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}
.player-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.action-btn{
  flex:1;
  min-width:100px;
  border:1px solid var(--border);
  background:#1e293b;
  color:var(--text);
  padding:11px 9px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
  transition: background 0.2s;
}
.action-btn:hover{background:#334155;}
.action-btn.primary{
  background:var(--primary);
  color:#ffffff;
  font-weight:bold;
  border: none;
}
.action-btn.primary:hover{
  background:var(--primary-hover);
}
.notice{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
  margin-top:12px;
}

/* HERO */
.hero{
  background:linear-gradient(120deg,#1e293b,#0f172a 65%,#1e1b4b);
  border:1px solid var(--border);
  border-radius:17px;
  padding:22px 18px;
  margin-bottom:20px;
}
.hero h2{margin:0 0 8px;font-size:23px;color:#38bdf8}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 13px;
}
.section-title h2{font-size:17px;margin:0;color:var(--text)}
.section-title span{color:#38bdf8;font-size:11px;font-weight:bold}
.search-wrap{margin-bottom:13px}
.search-wrap input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px 14px;
  color:var(--text);
  outline:none;
  box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
}
.search-wrap input:focus{border-color:var(--primary);box-shadow: 0 0 0 3px rgba(2,132,199,0.25);}
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:16px;
}
.tab{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  padding:9px 14px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
  font-size:12px;
  transition: all 0.2s;
}
.tab.active{background:var(--primary);color:#ffffff;font-weight:bold;border-color:var(--primary)}

/* VIDEO GRID */
.video-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
.video-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.2);
}
.video-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow: 0 10px 15px -3px rgba(0,0,0,0.4)}
.thumb{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  background:#0f172a;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.3s;
}
.video-card:hover .thumb img{transform:scale(1.04)}
.play-icon{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.3);
}
.play-icon span{
  width:43px;height:43px;
  border-radius:50%;
  display:grid;
  place-items:center;
  padding-left:3px;
  background:rgba(2,132,199,0.92);
  color:#ffffff;
  font-size:19px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.4);
}
.video-info{padding:10px}
.video-info h3{
  font-size:12px;
  line-height:1.45;
  margin:0 0 7px;
  min-height:35px;
  color:var(--text);
}
.video-meta{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
}
.video-meta b{color:#38bdf8}
.empty{
  display:none;
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}
.pagination{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin:22px 0;
  flex-wrap:wrap;
}
.page-btn{
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  transition: background 0.2s;
}
.page-btn:hover{background:#334155;}
.page-btn.active{background:var(--primary);color:#ffffff;font-weight:bold;border-color:var(--primary)}
.page-btn:disabled{opacity:.35;cursor:not-allowed}

  border-top:1px solid var(--border);
